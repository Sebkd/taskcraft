name: CI

# Runs on GitHub's hosted runners. Development lives on Gitea; commits reach
# GitHub through a push mirror, which pushes every branch and opens no pull
# requests here, so every push is checked.
on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Every crate must opt into the shared lints, or `unsafe_code = "forbid"`
      # and the clippy set silently stop applying to it.
      - name: Workspace lints in every crate
        run: |
          missing=0
          for manifest in crates/*/Cargo.toml; do
            if ! grep -Pzq '\[lints\]\s*\nworkspace\s*=\s*true' "$manifest"; then
              echo "::error file=$manifest::missing [lints] workspace = true"
              missing=1
            fi
          done
          exit $missing

      # Invariant 1.3.14: the core depends on no Kafka client, database
      # driver or state machine library, whatever its features.
      - name: Core dependency tree
        run: |
          if cargo tree -p taskcraft -e normal --all-features --locked | grep -E 'rdkafka|statecraft|sqlx|postgres'; then
            echo "::error::the core must not depend on these crates"
            exit 1
          fi

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      # E-11 lives outside the workspace; the workspace examples are linted
      # by the clippy step above. Examples are built, never run, in CI.
      - name: Example outside the workspace
        run: cargo clippy --manifest-path examples/axum-service/Cargo.toml -- -D warnings

      - name: Docs
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      # Catches missing metadata and internal dependency versions that drift
      # from the crates they point at.
      - name: Publish (dry run)
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          core_published=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "taskcraft-ci (github.com/Sebkd/taskcraft)" \
            "https://crates.io/api/v1/crates/taskcraft/$version")
          for manifest in crates/*/Cargo.toml; do
            if grep -q '^publish = false' "$manifest"; then
              echo "skipped (publish = false): $manifest"
              continue
            fi
            # A dry run builds against taskcraft from crates.io: the other
            # packages can be checked only once this version of it is out.
            if [ "$manifest" != crates/taskcraft/Cargo.toml ] && [ "$core_published" != 200 ]; then
              echo "skipped until taskcraft $version is published: $manifest"
              continue
            fi
            cargo publish --dry-run --locked --manifest-path "$manifest"
          done

  msrv:
    name: MSRV (1.99)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.99
        uses: dtolnay/rust-toolchain@1.99

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Every test on the minimum compiler, without services (those tests
      # skip). Should a dev-dependency ever require a newer compiler, narrow
      # this to `-p taskcraft` rather than dropping the tests.
      - name: Test
        run: cargo test --workspace --all-features --locked

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Development happens on macOS: rdkafka's native build and tool paths
      # differ from Linux. No services here; the tests that need them skip.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked

  semver:
    name: API compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks

      # Against the latest published version of each package: while the
      # workspace version equals it, a breaking change fails here instead of
      # slipping into a patch release.
      - name: Check
        run: cargo semver-checks --workspace --all-features

  loom:
    name: Loom
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --cfg taskcraft_loom
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Every interleaving of the task registry's critical sections
      # (invariant 1.3.8). The cfg swaps its mutex for loom's.
      - name: Model check
        run: cargo test -p taskcraft --release --locked --lib loom

  properties:
    name: Properties
    runs-on: ubuntu-latest
    env:
      PROPTEST_CASES: "10000"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Random sequences of pushes, cancels, outcomes and stops against
      # invariants 1.3.6, 1.3.8 and 1.3.9; the other runs use 256 cases.
      - name: Test
        run: cargo test -p taskcraft --release --locked --test properties

  fuzz:
    name: Fuzz (short)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      # A prebuilt cargo-fuzz is a musl binary and defaults to its own
      # target, whose std the toolchain lacks: the steps name the target.
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      # Logs of this repository's runs are not public: on failure the key
      # lines go out as annotations, which are.
      - name: Build the fuzz targets
        working-directory: fuzz
        run: ../.github/annotate.sh build.log cargo fuzz build --target x86_64-unknown-linux-gnu

      # A minute per decoder: no panic, no hang (10 s per input). Longer
      # runs are done by hand before releases.
      - name: Fuzz JsonCodec
        working-directory: fuzz
        run: ../.github/annotate.sh run.log cargo fuzz run json_decode --target x86_64-unknown-linux-gnu -- -max_total_time=60 -timeout=10

      - name: Fuzz KafkaJsonCodec
        working-directory: fuzz
        run: ../.github/annotate.sh run.log cargo fuzz run kafka_decode --target x86_64-unknown-linux-gnu -- -max_total_time=60 -timeout=10

      - name: Fuzz metadata
        working-directory: fuzz
        run: ../.github/annotate.sh run.log cargo fuzz run metadata --target x86_64-unknown-linux-gnu -- -max_total_time=60 -timeout=10

      # The input that broke a decoder, to replay with `cargo fuzz run <target> <file>`.
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka:3.9.0
        ports:
          - 9092:9092
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TASKCRAFT_KAFKA_BROKERS: localhost:9092
      TASKCRAFT_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
      TASKCRAFT_REQUIRE_SERVICES: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Wait for the broker
        run: |
          for i in $(seq 1 60); do
            nc -z localhost 9092 && exit 0
            sleep 2
          done
          echo "::error::broker did not start"
          exit 1

      # Doc tests are not measured (that needs nightly). The broker tests run
      # on one thread, as in the Kafka job.
      - name: Measure
        run: |
          cargo llvm-cov --no-report --workspace --all-features --locked --exclude taskcraft-kafka
          cargo llvm-cov --no-report -p taskcraft-kafka --all-features --locked -- --test-threads 1

      # The threshold sits a little below the first measurement (89.9% of
      # lines on 0.2.1); changes that add tests raise it.
      - name: Report
        run: |
          .github/annotate.sh summary.log cargo llvm-cov report --summary-only
          .github/annotate.sh html.log cargo llvm-cov report --html --output-dir coverage
          .github/annotate.sh lcov.log cargo llvm-cov report --lcov --output-path coverage/lcov.info --fail-under-lines 87
          # The total, as an annotation: visible without the run's logs.
          echo "::notice::$(grep '^TOTAL' summary.log)"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 14

  kafka:
    name: Kafka source (broker)
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka:3.9.0
        ports:
          - 9092:9092
    env:
      TASKCRAFT_KAFKA_BROKERS: localhost:9092
      TASKCRAFT_REQUIRE_SERVICES: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Wait for the broker
        run: |
          for i in $(seq 1 60); do
            nc -z localhost 9092 && exit 0
            sleep 2
          done
          echo "::error::broker did not start"
          exit 1

      - name: Test
        run: cargo test -p taskcraft-kafka --locked -- --test-threads 1

  postgres:
    name: Task store (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TASKCRAFT_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
      TASKCRAFT_REQUIRE_SERVICES: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test -p taskcraft-postgres --locked
