# E-11 `axum-service`: a standalone example crate, outside the workspace, so
# axum and hyper stay out of the library's lock file and supply-chain checks.
[package]
name = "axum-service"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace]

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
taskcraft = { path = "../../crates/taskcraft" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
