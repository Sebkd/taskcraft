# cargo-deny: known vulnerabilities, licenses, duplicate versions, sources.
# Run locally with `cargo deny check`; CI runs it in supply-chain.yml.

[graph]
all-features = true

[advisories]
# RustSec advisory database; replaces a separate cargo-audit step.
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "ISC",
    "BSD-3-Clause",
    "Zlib",
    # Data licence of `webpki-roots` (the Mozilla root certificates), behind
    # the optional `tls-rustls` feature of the task store.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# The list anticipates future dependencies; unused entries are expected.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
