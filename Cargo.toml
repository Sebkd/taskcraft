[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["sebkd <sebkd80@gmail.com>"]
repository = "https://github.com/Sebkd/taskcraft"

[workspace.dependencies]
metrics = "0.24"
serde = "1"
serde_json = "1"
thiserror = "2"
tokio = "1"
tokio-util = "0.7"
tower = { version = "0.5", default-features = false }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"

# The apalis set, minus its workspace-wide `type_complexity = "allow"`:
# heavy generics are a known weakness of that design, so they stay visible.
[workspace.lints.clippy]
await_holding_lock = "warn"
# Invariant 1.3.19: library code never panics by itself. Tests may, see
# `.clippy.toml`.
expect_used = "warn"
panic = "warn"
unreachable = "warn"
unwrap_used = "warn"
dbg_macro = "warn"
empty_enums = "warn"
enum_glob_use = "warn"
equatable_if_let = "warn"
exit = "warn"
filter_map_next = "warn"
fn_params_excessive_bools = "warn"
if_let_mutex = "warn"
implicit_clone = "warn"
imprecise_flops = "warn"
inefficient_to_string = "warn"
linkedlist = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
match_wildcard_for_single_variants = "warn"
mem_forget = "warn"
must_use_candidate = "warn"
needless_borrow = "warn"
needless_continue = "warn"
needless_pass_by_ref_mut = "warn"
needless_pass_by_value = "warn"
option_option = "warn"
redundant_clone = "warn"
ref_option = "warn"
rest_pat_in_fully_bound_structs = "warn"
return_self_not_must_use = "warn"
single_match_else = "warn"
str_to_string = "warn"
suboptimal_flops = "warn"
todo = "warn"
trivially_copy_pass_by_ref = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"
use_self = "warn"
