[package]
name = "taskcraft"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "Background task queue for Rust on tokio: three-way source polling, retries as data, resource pools, graceful shutdown"
keywords = ["queue", "background", "jobs", "tasks", "tokio"]
categories = ["asynchronous", "concurrency"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros", "rt"] }
tokio-util = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[features]
# Test harness: a fault-injecting source, a delivery ledger and reusable
# scenarios for workers (`taskcraft::testing`).
test-util = []

[dev-dependencies]
# A real state machine for the runnable tests; never a normal dependency
# (spec 1.3.14, change criterion 2).
statecraft-fsm = { version = "0.2", features = ["tokio"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
tower = { workspace = true, features = ["util", "timeout", "limit"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry"] }

[lints]
workspace = true
