[package]
name = "taskcraft"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "Background task queue for Rust on tokio: three-way source polling, retries as data, resource pools, graceful shutdown"
keywords = ["queue", "background", "jobs", "tasks", "tokio"]
categories = ["asynchronous", "concurrency"]

[dependencies]
metrics = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros", "rt"] }
tokio-util = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[features]
# Test harness: a fault-injecting source, a delivery ledger and reusable
# scenarios for workers (`taskcraft::testing`).
test-util = []
# The standard series of spec 4.4.2 through the `metrics` facade
# (`MetricsObserver`).
metrics = ["dep:metrics"]
# Library events also as `log` records while no tracing subscriber is set,
# for applications on `log` (spec 2.9).
log = ["tracing/log"]

[dev-dependencies]
# A real state machine for the runnable tests; never a normal dependency
# (spec 1.3.14, change criterion 2).
statecraft-fsm = { version = "0.2", features = ["tokio"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
tower = { workspace = true, features = ["util", "timeout", "limit"] }
log = "0.4"
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "json"] }

[lints]
workspace = true
