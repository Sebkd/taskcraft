[package]
name = "taskcraft-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
description = "PostgreSQL task store for taskcraft: push, status and history, deferred redelivery, leases"
keywords = ["queue", "postgres", "background", "tasks", "tokio"]
categories = ["asynchronous", "concurrency", "database"]

[dependencies]
serde_json = { workspace = true }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio"] }
taskcraft = { path = "../taskcraft", version = "0.3.0" }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tracing = { workspace = true }

[features]
# TLS for connections the store opens itself; a pool passed in brings its own.
tls-rustls = ["sqlx/tls-rustls"]
tls-native-tls = ["sqlx/tls-native-tls"]

[dev-dependencies]
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio"] }
serde = { workspace = true, features = ["derive"] }
taskcraft = { path = "../taskcraft" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
uuid = { workspace = true }

[lints]
workspace = true
